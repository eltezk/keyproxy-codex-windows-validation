name: Release gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &release_paths
      - 'keyproxy-codex-install.sh'
      - 'keyproxy-codex-install.sh.sha256'
      - 'keyproxy-codex-install-windows.ps1'
      - 'keyproxy-codex-install-windows.ps1.sha256'
      - 'keyproxy-codex-unix-selftest.sh'
      - 'keyproxy-codex-windows-native-selftest.ps1'
      - 'site/**'
      - 'scripts/build-public-bundle.sh'
      - 'keyproxy-hub-setup/**'
      - '.github/workflows/release-gate.yml'
  pull_request:
    branches: [main]
    paths: *release_paths

permissions:
  contents: read

jobs:
  unix:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate Bash syntax and checksum
        shell: bash
        run: |
          bash -n keyproxy-codex-install.sh
          bash -n keyproxy-codex-unix-selftest.sh
          bash -n scripts/build-public-bundle.sh
          shasum -a 256 -c keyproxy-codex-install.sh.sha256
      - name: Enforce one Codex source across distributions
        shell: bash
        run: |
          cmp keyproxy-codex-install.sh keyproxy-hub-setup/codex/keyproxy-codex-install.sh
          cmp keyproxy-codex-install-windows.ps1 keyproxy-hub-setup/codex/keyproxy-codex-install-windows.ps1
          cmp keyproxy-codex-unix-selftest.sh keyproxy-hub-setup/codex/keyproxy-codex-unix-selftest.sh
          cmp keyproxy-codex-windows-native-selftest.ps1 keyproxy-hub-setup/codex/keyproxy-codex-windows-native-selftest.ps1
      - name: Execute isolated Unix self-test
        shell: bash
        env:
          TEST_LOGIN_SHELL: /bin/bash
        run: bash keyproxy-codex-unix-selftest.sh keyproxy-codex-install.sh
      - name: Build intuitive site delivery
        shell: bash
        run: bash scripts/build-public-bundle.sh dist/keyproxy-codex-site
      - name: Verify publishable content
        shell: bash
        run: |
          upload=dist/keyproxy-codex-site/UPLOAD-NO-SITE
          test "$(find "$upload" -maxdepth 1 -type f | wc -l)" -eq 4
          test -f "$upload/install.sh"
          test -f "$upload/install.sh.sha256"
          test -f "$upload/install.ps1"
          test -f "$upload/install.ps1.sha256"
          (cd "$upload" && shasum -a 256 -c install.sh.sha256 && shasum -a 256 -c install.ps1.sha256)
          test -f dist/keyproxy-codex-site/LEIA-ME-PRIMEIRO.txt
          test -f dist/keyproxy-codex-site/COPIAR-E-COLAR-NO-SITE.html
          test -f dist/keyproxy-codex-site/COPIAR-E-COLAR-NO-SITE.md
          grep -Fq 'curl -fLO https://keyproxyhub.store/downloads/codex/install.sh' \
            dist/keyproxy-codex-site/COPIAR-E-COLAR-NO-SITE.*
          grep -Fq 'Invoke-WebRequest https://keyproxyhub.store/downloads/codex/install.ps1' \
            dist/keyproxy-codex-site/COPIAR-E-COLAR-NO-SITE.*
          grep -Fq 'Quero verificar o SHA-256 antes' \
            dist/keyproxy-codex-site/COPIAR-E-COLAR-NO-SITE.*
          ! grep -ERi 'raw\.githubusercontent\.com|github\.com/eltezk|SEU-DOMINIO' \
            dist/keyproxy-codex-site/COPIAR-E-COLAR-NO-SITE.*
          ! grep -ERi 'curl[^|]*\|[[:space:]]*(ba)?sh|wget[^|]*\|[[:space:]]*(ba)?sh|irm[^|]*\|[[:space:]]*iex' \
            dist/keyproxy-codex-site/COPIAR-E-COLAR-NO-SITE.*
          ! grep -ERi 'script (é|esta|está) (digitalmente )?assinado|assinatura (digital )?verificada' \
            dist/keyproxy-codex-site/COPIAR-E-COLAR-NO-SITE.*
          ! find "$upload" -maxdepth 1 -type f -name 'keyproxy-codex-install*' -print -quit | grep -q .
      - name: Test and build unified setup package
        shell: bash
        run: |
          bash -n keyproxy-hub-setup/keyproxy-hub.sh \
            keyproxy-hub-setup/tests/unix-selftest.sh \
            keyproxy-hub-setup/scripts/build-package.sh
          bash keyproxy-hub-setup/tests/unix-selftest.sh
          bash keyproxy-hub-setup/claude/tests/unix-selftest.sh
          bash keyproxy-hub-setup/codex/keyproxy-codex-unix-selftest.sh \
            keyproxy-hub-setup/codex/keyproxy-codex-install.sh
          bash keyproxy-hub-setup/scripts/build-package.sh
      - name: Upload ready-to-publish package
        uses: actions/upload-artifact@v4
        with:
          name: BAIXE-E-PUBLIQUE-NO-SITE
          path: dist/keyproxy-codex-site/
          if-no-files-found: error
          retention-days: 30
      - name: Upload unified setup package
        uses: actions/upload-artifact@v4
        with:
          name: KEYPROXY-HUB-SETUP
          path: keyproxy-hub-setup/dist/
          if-no-files-found: error
          retention-days: 30

  windows-keyproxy-hub:
    name: Unified setup PowerShell 7
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Test unified setup launcher and Claude module
        shell: pwsh
        run: |
          $env:NO_COLOR = '1'
          & .\keyproxy-hub-setup\tests\windows-selftest.ps1
          & .\keyproxy-hub-setup\claude\tests\windows-selftest.ps1
          & .\keyproxy-hub-setup\codex\keyproxy-codex-windows-native-selftest.ps1 `
            -InstallerPath .\keyproxy-hub-setup\codex\keyproxy-codex-install-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate unified setup package
        shell: pwsh
        run: |
          $env:NO_COLOR = '1'
          & .\keyproxy-hub-setup\keyproxy-hub.ps1 validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Execute isolated native self-test
        shell: powershell
        run: |
          & .\keyproxy-codex-windows-native-selftest.ps1 `
            -InstallerPath .\keyproxy-codex-install-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows SHA-256
        shell: powershell
        run: |
          $expected = (Get-Content .\keyproxy-codex-install-windows.ps1.sha256 -Raw).Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash .\keyproxy-codex-install-windows.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 divergente: $actual" }
          Write-Output "windows-get-filehash=ok $actual"
      - name: Test unified setup launcher and Claude module
        shell: powershell
        run: |
          $env:NO_COLOR = '1'
          & .\keyproxy-hub-setup\tests\windows-selftest.ps1
          & .\keyproxy-hub-setup\claude\tests\windows-selftest.ps1
          & .\keyproxy-hub-setup\codex\keyproxy-codex-windows-native-selftest.ps1 `
            -InstallerPath .\keyproxy-hub-setup\codex\keyproxy-codex-install-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate unified setup package
        shell: powershell
        run: |
          $env:NO_COLOR = '1'
          & .\keyproxy-hub-setup\keyproxy-hub.ps1 validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  powershell-7:
    name: PowerShell 7
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Execute isolated native self-test
        shell: pwsh
        run: |
          & .\keyproxy-codex-windows-native-selftest.ps1 `
            -InstallerPath .\keyproxy-codex-install-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
